<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>My Schedule</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="organizer.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="page-top">
      <a class="icon-btn" href="/" aria-label="Home"><svg><use href="#i-home"/></svg></a>
      <div class="page-title">
        <h1>My Schedule</h1>
        <p class="muted small" id="dayLabel"></p>
      </div>
      <button class="btn ghost small" id="goToday" hidden>Today</button>
    </header>

    <section class="card week-card">
      <div class="week-nav">
        <button class="icon-btn sm" id="prevWeek" aria-label="Previous week"><svg><use href="#i-left"/></svg></button>
        <b id="weekLabel"></b>
        <button class="icon-btn sm" id="nextWeek" aria-label="Next week"><svg><use href="#i-right"/></svg></button>
      </div>
      <div class="dstrip" id="dstrip"></div>
    </section>

    <div class="sum-chips" id="sumChips"></div>

    <section class="timeline" id="timeline"></section>

    <section class="card" id="dueCard" hidden>
      <div class="card-head"><h2>✅ Due this day</h2><a class="muted small" href="tasks.html">All tasks</a></div>
      <ul class="task-list" id="dueList"></ul>
    </section>
  </div>

  <nav class="bar">
    <a class="bar-btn" href="/"><svg><use href="#i-home"/></svg><span>Home</span></a>
    <button class="fab" id="addBtn" aria-label="Add"><svg><use href="#i-plus"/></svg></button>
    <a class="bar-btn" href="college.html"><span class="bar-emoji">🎓</span><span>College</span></a>
  </nav>

  <!-- ADD CHOOSER -->
  <dialog class="sheet" id="addSheet">
    <div class="handle"></div>
    <div class="sheet-head"><h2 id="addHead">Add to this day</h2><button class="icon-btn sm" data-close aria-label="Close"><svg><use href="#i-x"/></svg></button></div>
    <div class="add-grid">
      <button class="add-opt" data-add="shift"><span>💼</span><b>Work shift</b><small>Plan a shift</small></button>
      <button class="add-opt" data-add="event"><span>📌</span><b>Event</b><small>Appointment, meeting</small></button>
      <button class="add-opt" data-add="study"><span>📖</span><b>Study time</b><small>Block time to study</small></button>
      <button class="add-opt" data-add="exam"><span>📝</span><b>Exam</b><small>Date &amp; time</small></button>
      <button class="add-opt" data-add="personal"><span>🌿</span><b>Personal</b><small>Gym, family, rest</small></button>
      <button class="add-opt" data-add="task"><span>✅</span><b>Task</b><small>Due this day</small></button>
      <a class="add-opt wide" href="college.html?add=class"><span>🎓</span><b>Weekly lecture</b><small>Repeats every week · in College</small></a>
    </div>
  </dialog>

  <!-- CLASS INFO -->
  <dialog class="sheet" id="classSheet">
    <div class="handle"></div>
    <div class="sheet-head"><h2 id="ciTitle"></h2><button class="icon-btn sm" data-close aria-label="Close"><svg><use href="#i-x"/></svg></button></div>
    <div class="stack">
      <div class="info-rows" id="ciRows"></div>
      <button class="btn ghost" id="ciSkip"></button>
      <a class="btn primary big" id="ciEdit" href="#">Edit in College</a>
    </div>
  </dialog>

  <script src="core.js"></script>
  <script src="today.js"></script>
</body>
</html>
